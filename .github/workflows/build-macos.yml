name: Build macOS binary

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            codex-rs/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        working-directory: codex-rs
        run: cargo build --release --bin codex

      - name: Rename binary
        run: |
          cp codex-rs/target/release/codex codex-pwm-macos
          file codex-pwm-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-pwm-macos
          path: codex-pwm-macos
          retention-days: 30

  release:
    name: Create release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-pwm-macos

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.sha.outputs.short }}
          name: "codex-pwm build ${{ steps.sha.outputs.short }}"
          body: |
            ## codex-pwm — PWM exchange build

            macOS arm64 binary of Codex with two env var additions:

            ```bash
            export OPENAI_BASE_URL=https://physicsworldmodel.org/api/v1/exchange/openai
            export OPENAI_API_KEY=pwm_<your key>
            codex-pwm
            ```

            ### Changes vs upstream openai/codex
            - `OPENAI_BASE_URL` env var overrides `openai_base_url` config
            - `OPENAI_API_KEY` env var honoured as Bearer auth (same priority as `CODEX_API_KEY`)

            ### Install
            ```bash
            curl -L https://github.com/integritynoble/codex-pwm/releases/latest/download/codex-pwm-macos \
              -o /usr/local/bin/codex-pwm
            chmod +x /usr/local/bin/codex-pwm
            ```
          files: codex-pwm-macos
          draft: false
          prerelease: false
